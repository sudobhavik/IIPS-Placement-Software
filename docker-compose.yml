services:
  db:
    image: postgres:16-alpine
    env_file: .env
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend-init:
    build: ./backend
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app
    command: >
      sh -c "alembic upgrade head &&
      python -m app.scripts.seed_master_data &&
      if ls /app/seed_data/*.xlsx 1> /dev/null 2>&1; then
        for file in /app/seed_data/*.xlsx; do
          echo \"Importing $$file...\"
          python -m app.scripts.import_students --file \"$$file\" --batch-label '2024-26' --passing-year 2026 --admin-email admin@example.com
        done
      else
        echo 'No seed data found';
      fi"

  backend:
    build: ./backend
    env_file: .env
    depends_on:
      db:
        condition: service_healthy
      backend-init:
        condition: service_completed_successfully
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    command: uvicorn app.main:app --reload --host 0.0.0.0 --port 8000

  frontend:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./frontend:/app
    ports:
      - "5173:5173"
    command: sh -c "npm install && npm run dev -- --host"

volumes:
  pgdata:
